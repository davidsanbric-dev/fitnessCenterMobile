name: Cleanup Artifacts

# Manually-triggered maintenance job to reclaim Actions artifact storage.
# GitHub has no bulk-delete button in the UI and lowering the retention
# policy only affects NEW artifacts, so existing ones must be deleted via the
# API. This uses the built-in GITHUB_TOKEN (no PAT needed) and runs fine even
# when the storage quota is full, since running a workflow uses minutes, not
# storage.
on:
  workflow_dispatch:
    inputs:
      older_than_days:
        description: Only delete artifacts older than this many days (0 = delete all)
        required: false
        default: '0'
        type: string

permissions:
  actions: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete artifacts
        uses: actions/github-script@v7
        with:
          script: |
            const olderThanDays = parseInt('${{ inputs.older_than_days }}' || '0', 10);
            const cutoff = olderThanDays > 0
              ? Date.now() - olderThanDays * 24 * 60 * 60 * 1000
              : null;

            const artifacts = await github.paginate(
              github.rest.actions.listArtifactsForRepo,
              { owner: context.repo.owner, repo: context.repo.repo, per_page: 100 },
            );

            let deleted = 0, freed = 0;
            for (const a of artifacts) {
              if (cutoff && new Date(a.created_at).getTime() > cutoff) continue;
              await github.rest.actions.deleteArtifact({
                owner: context.repo.owner,
                repo: context.repo.repo,
                artifact_id: a.id,
              });
              deleted++;
              freed += a.size_in_bytes;
              console.log(`Deleted ${a.name} (#${a.id}) ${a.size_in_bytes} bytes, created ${a.created_at}`);
            }
            const mb = (freed / 1024 / 1024).toFixed(1);
            core.summary
              .addHeading('Artifact cleanup')
              .addRaw(`Deleted **${deleted}** of ${artifacts.length} artifacts, freeing **${mb} MB**.`)
              .write();
            console.log(`Done: deleted ${deleted}/${artifacts.length} artifacts, freed ${mb} MB`);
