name: Android Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      target:
        description: Where to publish the APK
        type: choice
        default: both
        options:
          - both
          - github
          - firebase
      release_tag:
        description: Git tag to attach to GitHub Releases when target includes github
        required: false
        type: string
      release_name:
        description: Release title for GitHub Releases
        required: false
        type: string

permissions:
  contents: write
  # Needed by the promote path to read & download the APK artifact from a
  # previous (push-to-main) workflow run.
  actions: read

# Every push to main triggers a build; cancel any in-flight run for the same
# ref so a newer commit supersedes an older one and they don't race on the
# shared Gradle cache. Manual dispatches are keyed separately by run id so they
# never cancel each other or a push.
concurrency:
  group: android-release-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    environment: deployment
    env:
      PUBLISH_TARGET: ${{ github.event_name == 'workflow_dispatch' && inputs.target || 'firebase' }}
      RELEASE_TAG_INPUT: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || '' }}
      RELEASE_NAME_INPUT: ${{ github.event_name == 'workflow_dispatch' && inputs.release_name || '' }}
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
      RELEASE_NAME: ${{ github.event_name == 'workflow_dispatch' && inputs.release_name || github.ref_name }}
      # Must match the Firebase Android app registered for the current
      # applicationId (com.davieldev.fitnesscenter). The previous value pointed
      # at the retired com.example.portfolio_mobile_app registration, so after
      # the rename CI would have distributed builds under the wrong app.
      FIREBASE_APP_ID: 1:291079672843:android:96b2517bbbd30474d4630e
      FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
      FIREBASE_APP_DISTRIBUTION_GROUPS: ${{ secrets.FIREBASE_APP_DISTRIBUTION_GROUPS }}
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      # Compile-time dart-defines consumed by the app. BASE_URL is required:
      # without it the release build crashes at startup (blank white screen).
      # The password-recovery keys are optional and degrade gracefully if unset.
      BASE_URL: ${{ secrets.BASE_URL }}
      PASSWORD_RESET_CONTINUE_URL: ${{ secrets.PASSWORD_RESET_CONTINUE_URL }}
      ANDROID_PACKAGE_NAME: ${{ secrets.ANDROID_PACKAGE_NAME }}
      ANDROID_MIN_VERSION: ${{ secrets.ANDROID_MIN_VERSION }}
      IOS_BUNDLE_ID: ${{ secrets.IOS_BUNDLE_ID }}
      FIREBASE_DYNAMIC_LINK_DOMAIN: ${{ secrets.FIREBASE_DYNAMIC_LINK_DOMAIN }}
      # DO_BUILD: compile a fresh APK. True for every push to main and for any
      # dispatch that distributes to Firebase (firebase/both). A dispatch with
      # target=github does NOT build — it promotes an existing tested build.
      DO_BUILD: ${{ github.event_name == 'push' || inputs.target == 'firebase' || inputs.target == 'both' }}
      # PROMOTE: don't build; download the exact APK from the latest successful
      # push-to-main build and attach it to the GitHub Release. This is the
      # "release the binary that was already tested on Firebase" path.
      PROMOTE: ${{ github.event_name == 'workflow_dispatch' && inputs.target == 'github' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Validate configuration up front so misconfigured runs fail in seconds,
      # before the expensive Java/Gradle/Flutter setup and build.
      - name: Validate GitHub release inputs
        if: ${{ github.event_name == 'workflow_dispatch' && (inputs.target == 'github' || inputs.target == 'both') }}
        shell: bash
        run: |
          if [ -z "$RELEASE_TAG_INPUT" ]; then
            echo "release_tag is required when target includes GitHub Releases."
            exit 1
          fi

      # Promote path: locate the most recent successful push-to-main build that
      # still has a (non-expired) APK artifact and remember its run id so the
      # next step can download the exact bytes — no rebuild.
      - name: Find build to promote
        id: promote
        if: ${{ env.PROMOTE == 'true' }}
        uses: actions/github-script@v7
        with:
          script: |
            const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'android-release.yml',
              branch: 'main',
              event: 'push',
              status: 'success',
              per_page: 50,
            });
            for (const run of runs) {
              const arts = await github.rest.actions.listWorkflowRunArtifacts({
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: run.id,
              });
              const apk = arts.data.artifacts.find(a => a.name === 'app-release-apk' && !a.expired);
              if (apk) {
                core.setOutput('run_id', String(run.id));
                core.setOutput('sha', run.head_sha);
                console.log(`Promoting app-release-apk from run ${run.id} (${run.head_sha})`);
                return;
              }
            }
            core.setFailed('No promotable app-release-apk artifact found on main. Run a build (push to main) first, or dispatch with target=both.');

      - name: Download artifact to promote
        if: ${{ env.PROMOTE == 'true' }}
        uses: actions/download-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk
          run-id: ${{ steps.promote.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Assemble dart-defines from secrets
        if: ${{ env.DO_BUILD == 'true' }}
        shell: bash
        run: |
          if [ -z "$BASE_URL" ]; then
            echo "::error::BASE_URL secret is empty. The release build would crash at startup (blank white screen). Set BASE_URL in the deployment environment secrets."
            exit 1
          fi
          jq -n \
            --arg base_url "$BASE_URL" \
            --arg pw_url "$PASSWORD_RESET_CONTINUE_URL" \
            --arg apkg "$ANDROID_PACKAGE_NAME" \
            --arg amin "$ANDROID_MIN_VERSION" \
            --arg ios "$IOS_BUNDLE_ID" \
            --arg domain "$FIREBASE_DYNAMIC_LINK_DOMAIN" \
            '{
              BASE_URL: $base_url,
              PASSWORD_RESET_CONTINUE_URL: $pw_url,
              ANDROID_PACKAGE_NAME: $apkg,
              ANDROID_MIN_VERSION: $amin,
              IOS_BUNDLE_ID: $ios,
              FIREBASE_DYNAMIC_LINK_DOMAIN: $domain
            }' > .dart-defines.ci.json

      - name: Set up Java
        if: ${{ env.DO_BUILD == 'true' }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        if: ${{ env.DO_BUILD == 'true' }}
        uses: gradle/actions/setup-gradle@v4
        with:
          # Runs on every push to main / manual dispatch. The concurrency group
          # above serializes runs, so allow every run to read and update the
          # build cache without races.
          cache-read-only: false

      - name: Set up Flutter
        if: ${{ env.DO_BUILD == 'true' }}
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          # Pin the version so the SDK cache key stays stable (an unpinned
          # 'stable' re-downloads whenever the channel advances) and releases
          # are reproducible. Bump deliberately when upgrading Flutter.
          flutter-version: 3.44.0
          cache: true

      - name: Install dependencies
        if: ${{ env.DO_BUILD == 'true' }}
        run: flutter pub get

      - name: Configure release keystore
        if: ${{ env.DO_BUILD == 'true' && env.ANDROID_KEYSTORE_BASE64 != '' }}
        shell: bash
        run: |
          mkdir -p android/app
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          cat > android/key.properties <<EOF
          storeFile=app/upload-keystore.jks
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF

      - name: Decode Firebase service account JSON
        id: firebase-sa
        if: ${{ env.FIREBASE_SERVICE_ACCOUNT_JSON != '' }}
        shell: bash
        run: |
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" | base64 --decode > /tmp/firebase-sa.json
          {
            echo "content<<__SAEOF__"
            cat /tmp/firebase-sa.json
            echo "__SAEOF__"
          } >> "$GITHUB_OUTPUT"

      - name: Build release APK
        if: ${{ env.DO_BUILD == 'true' }}
        run: flutter build apk --release --dart-define-from-file=.dart-defines.ci.json

      - name: Prepare release notes
        shell: bash
        env:
          PROMOTED_FROM_RUN: ${{ steps.promote.outputs.run_id }}
          PROMOTED_FROM_SHA: ${{ steps.promote.outputs.sha }}
        run: |
          {
            echo "Build: $RELEASE_NAME"
            echo "Ref: $GITHUB_REF"
            if [ -n "$PROMOTED_FROM_RUN" ]; then
              # Promote path: the released bytes are the artifact built (and
              # Firebase-distributed) by an earlier run, not this run's commit.
              echo "Commit: $PROMOTED_FROM_SHA"
              echo "Promoted exact APK from build run: $PROMOTED_FROM_RUN"
            else
              echo "Commit: $GITHUB_SHA"
            fi
          } > release-notes.txt

      - name: Publish to GitHub Releases
        if: ${{ github.event_name == 'workflow_dispatch' && (inputs.target == 'github' || inputs.target == 'both') }}
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_NAME }}
          body_path: release-notes.txt
          files: build/app/outputs/flutter-apk/app-release.apk

      - name: Publish to Firebase App Distribution
        if: ${{ (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && (inputs.target == 'firebase' || inputs.target == 'both'))) && env.FIREBASE_SERVICE_ACCOUNT_JSON != '' && env.FIREBASE_APP_DISTRIBUTION_GROUPS != '' }}
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ env.FIREBASE_APP_ID }}
          serviceCredentialsFileContent: ${{ steps.firebase-sa.outputs.content }}
          groups: ${{ env.FIREBASE_APP_DISTRIBUTION_GROUPS }}
          file: build/app/outputs/flutter-apk/app-release.apk
          releaseNotesFile: release-notes.txt

      # Kept last and non-blocking so a storage-quota error can never fail an
      # in-progress release/distribution. Only runs when we actually built an
      # APK (the promote path has nothing new to store). Retention is 90 days
      # so a build stays promotable to a GitHub Release well after it shipped
      # to Firebase; the Cleanup Artifacts workflow + per-run retention keep
      # the storage footprint in check.
      - name: Upload APK artifact
        if: ${{ env.DO_BUILD == 'true' }}
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 90
          # The APK is already a compressed archive; skip re-compression to
          # speed up the upload (default level 6 wastes CPU for ~0% gain).
          compression-level: 0