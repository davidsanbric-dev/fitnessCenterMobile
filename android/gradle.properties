org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Jetifier is only needed for legacy (non-AndroidX) dependencies; this project is
# fully AndroidX, so disabling it removes per-build dependency rewriting overhead.
android.enableJetifier=false

# Build performance: reuse task outputs across runs (paired with CI Gradle cache)
# and run independent tasks in parallel.
org.gradle.caching=true
org.gradle.parallel=true
